spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/catspell}
    username: ${DATABASE_USERNAME:catspell}
    password: ${DATABASE_PASSWORD:catspell}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: ${JWT_SECRET:ZGVmYXVsdC1kZXYtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLW11c3QtYmUtYXQtbGVhc3QtNjQtYnl0ZXMtbG9uZy1mb3ItaHM1MTI=}
  access-token-expiry: 3600000
  refresh-token-expiry-days: 30

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9002}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:catspell-photos}
    access-key: ${S3_ACCESS_KEY:catspell}
    secret-key: ${S3_SECRET_KEY:catspell123}

push:
  enabled: ${PUSH_ENABLED:false}
  firebase:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

email:
  enabled: ${EMAIL_ENABLED:false}

app:
  reset-password-url: ${RESET_PASSWORD_URL:catspell://reset-password}
  verify-email-url: ${VERIFY_EMAIL_URL:catspell://verify-email}
  confirm-email-change-url: ${CONFIRM_EMAIL_CHANGE_URL:catspell://confirm-email-change}
  report:
    operator-email: ${REPORT_OPERATOR_EMAIL:ops@catspell.example}
  age:
    minimum-age: ${AGE_MINIMUM_AGE:18}
  invite:
    enabled: ${INVITE_ENABLED:false}
    admin-token: ${INVITE_ADMIN_TOKEN:}   # deny-by-default when blank; NO guessable dev default
  waitlist:
    confirm-url: ${WAITLIST_CONFIRM_URL:http://localhost:8080/api/waitlist/confirm}
    confirm-success-url: ${WAITLIST_CONFIRM_SUCCESS_URL:http://localhost:3000/waitlist/confirmed}   # web landing-page URL (D-01/D-02)
    confirm-error-url: ${WAITLIST_CONFIRM_ERROR_URL:http://localhost:3000/waitlist/link-invalid}   # web landing-page URL (D-01/D-02)
    confirm-token-ttl-hours: ${WAITLIST_CONFIRM_TTL_HOURS:168}   # 7 days (D-08)
    per-email-capacity: ${WAITLIST_PER_EMAIL_CAPACITY:3}
    per-email-refill-hours: ${WAITLIST_PER_EMAIL_REFILL_HOURS:1}
    invite-url: ${WAITLIST_INVITE_URL:catspell://register}
    allowed-origins: ${WAITLIST_ALLOWED_ORIGINS:}   # blank = no CORS (server-to-server only)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-components: when-authorized
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
