spring:
  datasource:
    hikari:
      # The integration suite caches many distinct @SpringBootTest contexts (per @TestPropertySource /
      # @Import), and they all share ONE Testcontainers Postgres. Without a cap, each cached context's
      # pool (HikariCP default max 10) accumulates and exhausts Postgres max_connections (FATAL: too many
      # clients). Cap per-context connections so the sum stays well under the server limit.
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHM1MTItYWxnb3JpdGhtLW11c3QtYmUtYXQtbGVhc3QtNjQtYnl0ZXM=
  access-token-expiry: 3600000
  refresh-token-expiry-days: 30

storage:
  s3:
    endpoint: http://localhost:9002
    region: us-east-1
    bucket: catspell-photos
    access-key: catspell
    secret-key: catspell123

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-components: when-authorized
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health

email:
  enabled: false

app:
  reset-password-url: catspell://reset-password
  verify-email-url: catspell://verify-email
  confirm-email-change-url: catspell://confirm-email-change
  report:
    operator-email: ops@catspell.example
  invite:
    enabled: ${INVITE_ENABLED:false}
    admin-token: ${INVITE_ADMIN_TOKEN:}

rate-limit:
  capacity: 10000

server:
  port: 0
