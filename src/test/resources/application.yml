spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHM1MTItYWxnb3JpdGhtLW11c3QtYmUtYXQtbGVhc3QtNjQtYnl0ZXM=
  access-token-expiry: 3600000
  refresh-token-expiry-days: 30

storage:
  s3:
    endpoint: http://localhost:9002
    region: us-east-1
    bucket: catspell-photos
    access-key: catspell
    secret-key: catspell123

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-components: when-authorized
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health

rate-limit:
  capacity: 10000

server:
  port: 0
